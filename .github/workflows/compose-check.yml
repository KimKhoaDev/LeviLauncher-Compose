name: Compose compile check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Stub private build inputs
        run: |
echo '{"project_info":{"project_number":"1","project_id":"x","storage_bucket":"x.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"org.levimc.launcher"}},"api_key":[{"current_key":"x"}]}]}' > app/google-services.json
      - name: Compile Kotlin (Compose)
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee build.log
      - name: Surface errors as annotations
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|Could not |Caused by|error:" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=build-errors::${msg}"
